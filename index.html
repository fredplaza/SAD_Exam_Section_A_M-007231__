<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scholarship Monitoring System</title>
<style>
:root{
  --bg:#edf2f7;
  --fg:#1e2a36;
  --muted:#57667a;
  --card:#ffffff;
  --line:#d9e1ea;
  --line-strong:#c5ced9;
  --ac:#2d6cdf;
  --ac-dark:#1c53b7;
  --pill:#eaf2ff;
  --ok:#1f7a46;
  --ok-bg:#e8f7ee;
  --bad:#b3261e;
  --bad-bg:#fdeceb;
  --warn:#9a6700;
  --warn-bg:#fff3d9;
  --shadow:0 12px 28px rgba(15,23,42,.06);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#141b22;--fg:#eaf1f7;--muted:#a9b6c4;--card:#1d2733;--line:#2f3b48;--line-strong:#47576c;--ac:#6ea4ff;--ac-dark:#80b1ff;--pill:#20314d;--ok:#74d9a0;--ok-bg:#123526;--bad:#ff8c82;--bad-bg:#3a1a1c;--warn:#f7c76a;--warn-bg:#463613;--shadow:0 12px 32px rgba(0,0,0,.24)}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(180deg,var(--bg),#f5f8fb 28%,var(--bg));
  color:var(--fg);
  margin:0;
  padding:24px 18px 40px;
}
#app{max-width:1200px;margin:0 auto}
h2{margin:0 0 18px;font-size:clamp(2rem,2vw,3rem);letter-spacing:-.04em;line-height:1.15;color:var(--fg)}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:18px 18px 16px;
  margin-bottom:18px;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  min-height:72px;
}
.userline{display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-size:1.05rem;line-height:1.4;color:var(--fg)}
.userline .role-tag{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;background:var(--pill);border:1px solid var(--line);font-size:.8rem;font-weight:700;text-transform:capitalize;color:var(--ac)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 16px;align-items:end}
label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
input,select,button,textarea{font:inherit}
input,select,textarea{
  width:100%;
  border:1px solid var(--line-strong);
  background:var(--card);
  color:var(--fg);
  border-radius:10px;
  padding:10px 12px;
  min-height:42px;
  transition:border-color .2s ease, box-shadow .2s ease;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(45,108,223,.12)}
button{
  appearance:none;
  border:1px solid var(--ac);
  background:var(--ac);
  color:#fff;
  border-radius:10px;
  padding:10px 14px;
  min-height:42px;
  font-weight:700;
  cursor:pointer;
  transition:transform .15s ease, background .2s ease, border-color .2s ease;
}
button:hover{transform:translateY(-1px);background:var(--ac-dark)}
button.s{
  background:var(--card);
  color:var(--fg);
  border-color:var(--line-strong);
}
button.s:hover{background:rgba(45,108,223,.04)}
.card h3{margin:0 0 14px;font-size:1.08rem;letter-spacing:-.02em}
.card p{margin:0 0 16px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stats div{border:1px solid var(--line);border-radius:12px;padding:12px 10px;background:linear-gradient(180deg,rgba(45,108,223,.02),transparent);text-align:center}
.stats b{display:block;font-size:1.8rem;line-height:1.1;margin-bottom:4px;letter-spacing:-.04em}
.tw{overflow-x:auto}
.table-wrap{border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}
th{background:rgba(148,163,184,.08);color:var(--muted);font-weight:800;letter-spacing:.02em;text-transform:uppercase;font-size:11px}
tr:last-child td{border-bottom:none}
.status-pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;line-height:1.4;border:1px solid transparent}
.ok{color:var(--ok);background:var(--ok-bg);border-color:rgba(31,122,70,.15)}
.bad{color:var(--bad);background:var(--bad-bg);border-color:rgba(179,38,30,.12)}
.warn{color:var(--warn);background:var(--warn-bg);border-color:rgba(154,103,0,.12)}
#msg{position:sticky;top:0;z-index:10;padding:10px 12px;border-radius:10px;margin-bottom:12px;border:1px solid transparent;display:none;background:rgba(45,108,223,.08);color:var(--fg)}
#msg[data-kind="error"]{background:rgba(179,38,30,.08);border-color:rgba(179,38,30,.1)}
#msg[data-kind="success"]{background:rgba(31,122,70,.08);border-color:rgba(31,122,70,.12)}
.hide{display:none}
ul{margin:4px 0 0;padding-left:18px;color:var(--muted)}
small{display:block;color:var(--muted);margin-top:12px;line-height:1.5}
@media (max-width: 720px){
  body{padding:18px 12px 28px}
  .topbar{flex-direction:column;align-items:flex-start}
  .card{padding:16px 14px}
  h2{font-size:1.9rem}
  .row{grid-template-columns:1fr 1fr}
}
@media (max-width: 520px){
  .row{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
}
</style></head><body>
<h2>Student Scholarship Monitoring &amp; Academic Compliance</h2>
<div id="msg"></div><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script>
// ---- CONFIG: use the anon/public key ONLY (never the service-role key) ----
const sb = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = t => new Date(t).toLocaleString("en-PH",{timeZone:"Asia/Manila"});
const academicStart = () => {
  const parts = new Intl.DateTimeFormat("en",{timeZone:"Asia/Manila",year:"numeric",month:"numeric"}).formatToParts(new Date());
  const values = Object.fromEntries(parts.map(part=>[part.type,part.value]));
  return Number(values.year) - (Number(values.month)<7 ? 1 : 0);
};
const academicTerms = () => {
  const start=academicStart();
  return Array.from({length:5},(_,i)=>start-2+i).flatMap(year=>[
    {value:`${year}-${year+1}|1`,label:`${year}-${year+1} S1`},
    {value:`${year}-${year+1}|2`,label:`${year}-${year+1} S2`}
  ]);
};
const academicYears = () => {
  const start=academicStart();
  return Array.from({length:5},(_,i)=>start-2+i).map(year=>`${year}-${year+1}`);
};
const defaultTerm = () => {
  const start=academicStart();
  const month=Number(new Intl.DateTimeFormat("en",{timeZone:"Asia/Manila",month:"numeric"}).format(new Date()));
  return `${start}-${start+1}|${month>=7?1:2}`;
};
let me=null, programs=[], state={sem:defaultTerm(),q:"",prog:"",comp:""};

function msg(t, ok){ const m=$("msg"); m.style.display="block"; m.dataset.kind=ok?"success":"error"; m.textContent=t; setTimeout(()=>m.style.display="none",6000); }
async function call(fn, args, okText){ const {data,error}=await sb.rpc(fn,args); if(error){msg(error.message,false);return null;} if(okText) msg(okText,true); return data ?? true; }

async function init(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ location.replace("login.html"); return; }
  const {data:p} = await sb.from("profiles").select("*").eq("auth_id",session.user.id).single();
  me=p; const {data:pr}=await sb.from("programs").select("*").order("id"); programs=pr||[];
  me.role==="staff"||me.role==="admin" ? staffView() : scholarView();
}
const bar=()=>`<div class="card topbar"><div class="userline"><span>${esc(me.full_name)} (${esc(me.student_id)})</span><span class="role-tag">${esc(me.role)}</span></div><button class="s" onclick="sb.auth.signOut().then(()=>location.href='login.html')">Sign out</button></div>`;
const badge=s=>`<span class="status-pill ${s==="Verified"||s==="Compliant"||s==="Approved"?"ok":s==="Returned"||s==="With Deficiency"?"bad":"warn"}">${esc(s)}</span>`;
const reasons=a=>a&&a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";
const checks=a=>a&&a.length?`<ul>${a.map(x=>`<li>${x.passed?"Pass":"Fail"}: ${esc(x.label)}</li>`).join("")}</ul>`:"";

// ---------------- SCHOLAR ----------------
async function scholarView(){
  const {data:subs}=await sb.from("submissions").select("*").order("submitted_at",{ascending:false});
  $("app").innerHTML=bar()+`<div class="card"><h3>Submit semester academic summary</h3>
  <p>Use this form for a new semester, or to resubmit a <b>Returned</b> record (same year/semester).</p><div class="row">
  <label>Academic year<select id="ay">${academicYears().map(year=>`<option ${year===defaultTerm().split("|")[0]?"selected":""}>${year}</option>`).join("")}</select></label>
  <label>Semester<select id="sm"><option>1</option><option>2</option></select></label>
  <label>GWA (1.00–5.00)<input id="gwa" type="number" step="0.01" min="1" max="5"></label>
  <label>Enrolled units<input id="un" type="number" min="0" step="1"></label>
  <label>Failed<input id="fl" type="number" min="0" step="1" value="0"></label>
  <label>Incomplete<input id="ic" type="number" min="0" step="1" value="0"></label>
  <label>Dropped<input id="dr" type="number" min="0" step="1" value="0"></label>
  <label>Grade-document reference<input id="ev" placeholder="e.g. DOC-123"></label>
  <button id="go">Submit</button></div></div>
  <div class="card"><h3>My submissions</h3><div class="tw table-wrap"><table><tr><th>Term</th><th>Summary</th><th>Submitted</th><th>Verification</th><th>Compliance</th><th>Renewal</th><th></th></tr>
  ${(subs||[]).map(s=>`<tr><td>${s.academic_year} S${s.semester}</td><td>GWA ${s.gwa}, ${s.units}u, F${s.failed_count} INC${s.inc_count} D${s.dropped_count}<br>${esc(s.evidence_ref)}</td>
  <td>${fmt(s.submitted_at)}</td><td>${badge(s.verification_status)}<br>${esc(s.verification_reason)}</td><td>${badge(s.compliance_result)}${checks(s.compliance_checks)}${reasons(s.compliance_reasons)}</td>
  <td>${badge(s.renewal_decision)}<br>${esc(s.decision_note)}</td><td><button class="s" onclick="hist('${s.id}')">History</button></td></tr>`).join("")||"<tr><td colspan=7>None yet</td></tr>"}</table></div><div id="h"></div></div>`;
  $("go").onclick=async()=>{
    const gwa=parseFloat($("gwa").value), nums=["un","fl","ic","dr"].map(i=>$(i).value);
    if(isNaN(gwa)||gwa<1||gwa>5) return msg("GWA must be between 1.00 and 5.00",false);
    if(nums.some(v=>!/^\d+$/.test(v))) return msg("Units and counts must be non-negative whole numbers",false);
    if(!$("ev").value.trim()) return msg("Grade-document reference is required",false);
    if(await call("submit_grades",{p_ay:$("ay").value,p_sem:+$("sm").value,p_gwa:gwa,p_units:+nums[0],p_failed:+nums[1],p_inc:+nums[2],p_drop:+nums[3],p_evidence:$("ev").value},"Submitted — status: Pending verification")) scholarView();
  };
}
async function hist(id){
  const {data}=await sb.from("audit_log").select("*").eq("submission_id",id).order("at");
  const ids=[...new Set((data||[]).map(x=>x.actor_id).filter(Boolean))];
  const {data:ps}=ids.length?await sb.from("profiles").select("id,full_name").in("id",ids):{data:[]};
  const nm=Object.fromEntries((ps||[]).map(p=>[p.id,p.full_name]));
  $("h").innerHTML=`<h4>History</h4><ul>${(data||[]).map(x=>`<li>${fmt(x.at)} — <b>${esc(x.action)}</b> by ${esc(nm[x.actor_id]||"scholar/self")}: ${esc(x.detail)}</li>`).join("")}</ul>`;
}

// ---------------- STAFF ----------------
async function staffView(){
  const [{data:allProfiles},{data:asg},{data:subs}]=await Promise.all([sb.from("profiles").select("*"),sb.from("assignments").select("*"),sb.from("submissions").select("*")]);
  const profs=(allProfiles||[]).filter(p=>p.role==="scholar");
  const pn=Object.fromEntries(programs.map(p=>[p.id,p.name])), pm=Object.fromEntries(profs.map(p=>[p.id,p]));
  const am=Object.fromEntries(asg.map(a=>[a.scholar_id,a.program_id]));
  const [ay,sem]=state.sem.split("|");
  const rows=subs.filter(s=>s.academic_year===ay&&String(s.semester)===sem).map(s=>({s,p:pm[s.scholar_id]||{},prog:pn[am[s.scholar_id]]||"—"}));
  const q=state.q.toLowerCase();
  const shown=rows.filter(r=>(!q||(r.p.student_id||"").toLowerCase().includes(q)||(r.p.full_name||"").toLowerCase().includes(q))&&(!state.prog||r.prog===state.prog)&&(!state.comp||r.s.compliance_result===state.comp));
  const c=k=>rows.filter(r=>r.s.compliance_result===k).length;
  $("app").innerHTML=bar()+`<div class="card"><h3>Dashboard — ${ay} Semester ${sem}</h3><div class="stats">
   <div><b>${asg.length}</b>Assigned scholars</div><div><b>${rows.filter(r=>r.s.verification_status==="Pending").length}</b>Pending verification</div>
   <div><b>${c("Compliant")}</b>Compliant</div><div><b>${c("With Deficiency")}</b>With deficiency</div></div></div>
  ${me.role==="admin"?`<div class="card"><h3>Account roles</h3><div class="tw"><table><tr><th>Student ID</th><th>Name</th><th>Role</th><th></th></tr>
   ${(allProfiles||[]).map(p=>`<tr><td>${esc(p.student_id)}</td><td>${esc(p.full_name)}</td><td><select id="role-${p.id}">${["scholar","staff","admin"].map(r=>`<option value="${r}" ${p.role===r?"selected":""}>${r}</option>`).join("")}</select></td><td><button class="s" onclick="saveRole('${p.id}')" ${p.id===me.id?"disabled title=\"You cannot change your own role\"":""}>Save role</button></td></tr>`).join("")}</table></div></div>`:""}
  <div class="card"><h3>Register / assign scholar</h3><div class="row"><label>Student ID<input id="rs"></label><label>Name<input id="rn"></label>
   <label>Program<select id="rp">${programs.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></label><button id="rg">Save</button></div>
   <small>Policy thresholds come from the program records: ${programs.map(p=>`${esc(p.name)} (GWA≤${p.max_gwa}, units≥${p.min_units}, F≤${p.max_failed}, INC≤${p.max_inc}, D≤${p.max_drop})`).join("; ")}</small></div>
  <div class="card"><div class="row"><label>Semester<select id="fs">${academicTerms().map(term=>`<option value="${term.value}">${term.label}</option>`).join("")}</select></label>
   <label>Search ID / name<input id="fq" value="${esc(state.q)}"></label>
   <label>Program<select id="fp"><option value="">All</option>${programs.map(p=>`<option ${state.prog===p.name?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label>
   <label>Compliance<select id="fc">${["","Not Evaluated","Compliant","With Deficiency"].map(x=>`<option ${state.comp===x?"selected":""} value="${x}">${x||"All"}</option>`).join("")}</select></label><button id="fa">Apply</button></div></div>
  <div class="card"><div class="tw table-wrap"><table><tr><th>Scholar</th><th>Program</th><th>Summary</th><th>Submitted</th><th>Verification</th><th>Compliance</th><th>Renewal</th><th>Actions</th></tr>
  ${shown.map(({s,p,prog})=>`<tr><td>${esc(p.student_id)}<br>${esc(p.full_name)}</td><td>${esc(prog)}</td>
   <td>GWA ${s.gwa}, ${s.units}u, F${s.failed_count} INC${s.inc_count} D${s.dropped_count}<br>${esc(s.evidence_ref)}</td><td>${fmt(s.submitted_at)}</td>
  <td>${badge(s.verification_status)}<br>${esc(s.verification_reason)}</td><td>${badge(s.compliance_result)}${checks(s.compliance_checks)}${reasons(s.compliance_reasons)}</td>
   <td>${badge(s.renewal_decision)}<br>${esc(s.decision_note)}</td>
   <td><button onclick="act('V','${s.id}')">Verify</button> <button class="s" onclick="act('R','${s.id}')">Return</button> <button onclick="act('E','${s.id}')">Evaluate</button>
   <button onclick="act('A','${s.id}')">Approve</button> <button class="s" onclick="act('H','${s.id}')">Hold</button> <button class="s" onclick="hist('${s.id}')">History</button></td></tr>`).join("")||"<tr><td colspan=8>No records</td></tr>"}</table></div><div id="h"></div></div>`;
  $("fs").value=state.sem;
  $("fa").onclick=()=>{state={sem:$("fs").value,q:$("fq").value,prog:$("fp").value,comp:$("fc").value};staffView();};
  $("rg").onclick=async()=>{if(await call("register_scholar",{p_student_id:$("rs").value.trim(),p_name:$("rn").value.trim(),p_program:+$("rp").value},"Scholar saved"))staffView();};
}
async function saveRole(id){
  const role=$("role-"+id).value;
  if(await call("set_profile_role",{p_profile_id:id,p_role:role},"Account role updated")) staffView();
}
async function act(k,id){
  let ok;
  if(k==="V") ok=await call("verify_submission",{p_id:id,p_status:"Verified",p_reason:prompt("Note (optional)")||null},"Verified");
  if(k==="R"){const r=prompt("Reason for return (required)"); if(r===null)return; ok=await call("verify_submission",{p_id:id,p_status:"Returned",p_reason:r},"Returned to scholar");}
  if(k==="E") ok=await call("evaluate_submission",{p_id:id},"Evaluated");
  if(k==="A"||k==="H"){const n=prompt("Decision note"); if(n===null)return; ok=await call("decide_renewal",{p_id:id,p_decision:k==="A"?"Approved":"Held",p_note:n},"Decision recorded");}
  if(ok) staffView();
}
init();
</script></body></html>
