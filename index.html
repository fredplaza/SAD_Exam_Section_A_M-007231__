<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Service Desk | ICT Requests</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/app.js" defer></script></head><body>
<header class="topbar"><div><p class="eyebrow">ICT SUPPORT PORTAL</p><h1>Service requests</h1></div><button id="logoutBtn" class="ghost-btn" type="button">Log out</button></header>
<main class="app-shell"><section class="dashboard" aria-label="Request summary"><article class="card"><p>Total requests</p><strong id="totalCount">0</strong></article><article class="card pending-card"><p>Pending</p><strong id="pendingCount">0</strong></article><article class="card progress-card"><p>In progress</p><strong id="progressCount">0</strong></article><article class="card completed-card"><p>Completed</p><strong id="completedCount">0</strong></article></section>
<section class="toolbar" aria-label="Request controls"><div class="filters"><input type="search" id="search" placeholder="Search requests" aria-label="Search requests"><select id="statusFilter" aria-label="Filter by status"><option value="">All statuses</option><option>Pending</option><option>In Progress</option><option>Completed</option></select><select id="priorityFilter" aria-label="Filter by priority"><option value="">All priorities</option><option>Low</option><option>Medium</option><option>High</option></select></div><button id="newBtn" class="primary-btn" type="button">+ New request</button></section>
<p id="dataMessage" class="data-message loading" role="status">Preparing requests…</p><section class="table-card"><div class="table-scroll"><table><thead><tr><th>ID</th><th>Requester</th><th>Department</th><th>Category</th><th>Priority</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody id="tableBody"></tbody></table></div></section></main>
<div id="requestModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-panel"><div class="modal-header"><div><p class="eyebrow">REQUEST DETAILS</p><h2 id="modalTitle">New service request</h2></div><button id="closeModalBtn" class="icon-btn" type="button" aria-label="Close form">×</button></div><form id="requestForm"><div class="form-grid"><label>Requester name<input type="text" id="requester" required autocomplete="name"></label><label>Department<input type="text" id="department" required></label><label>Category<select id="category" required><option value="">Select a category</option><option>Computer Repair</option><option>Software Installation</option><option>Internet/Network Problem</option><option>Printer Problem</option><option>Account/Access Concern</option><option>Other ICT Concern</option></select></label><label>Priority<select id="priority" required><option value="">Select priority</option><option>Low</option><option>Medium</option><option>High</option></select></label><label>Status<select id="status"><option>Pending</option><option>In Progress</option><option>Completed</option></select></label></div><label>Description<textarea id="description" required minlength="5" placeholder="Briefly describe the issue and any relevant details."></textarea></label><input type="hidden" id="requestId"><div class="form-actions"><button id="cancelBtn" class="secondary-btn" type="button">Cancel</button><button id="saveBtn" class="primary-btn" type="submit">Submit request</button></div></form></div></div></body></html>
